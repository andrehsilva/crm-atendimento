[project]
name = "isis-backend"
version = "0.1.0"
description = "Backend da Ísis — atendente virtual para clínicas odontológicas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "openai>=1.60",
    "httpx>=0.27",
    "psycopg-pool>=3.2",
    "agno>=3.2.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
